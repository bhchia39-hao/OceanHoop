<style>
:root{--ink:#183B56;--mut:#52718A;--lt:#8ED8F8;--sky:#BDEBFF;--oc:#278CCB;--bg:#F4FAFE;--card:#fff;--line:#D3E8F5;--ball:#E8742A;--warn:#FFF4D6}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.15;margin:0 0 .6rem}h2{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}
p{margin:0 0 1rem;max-width:62ch}a{color:var(--oc)}:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 1.25rem}
header{position:sticky;top:0;z-index:20;background:rgba(244,250,254,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font:800 1.1rem 'Bricolage Grotesque',sans-serif;text-decoration:none;color:var(--ink);letter-spacing:.04em}
nav ul{display:flex;gap:.2rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}nav ul a{display:block;padding:.3rem .7rem;border-radius:99px;text-decoration:none;color:var(--mut);font-weight:500;font-size:.92rem}nav ul a:hover{background:var(--sky);color:var(--ink)}
.lang{display:flex;gap:.2rem}.lang button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.2rem .6rem;font:600 .8rem Figtree,sans-serif;color:var(--ink);cursor:pointer}.lang button.on{background:var(--oc);border-color:var(--oc);color:#fff}
@media(max-width:760px){.brand{display:none}nav{height:auto;flex-direction:column;padding:.4rem 0;gap:.3rem}}
.hero{position:relative;text-align:center;padding:3.5rem 0 7rem;background:linear-gradient(180deg,var(--bg),var(--sky) 70%,var(--lt));overflow:hidden}
.lw{position:relative;width:min(210px,52vw);margin:0 auto 1rem}.lw img{position:relative;z-index:1;width:100%;display:block}
.lw i{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:1;border:2px solid var(--oc);border-radius:50%;opacity:0;transform:translate(-50%,-50%);animation:rp 6s ease-out infinite}
.lw i:nth-child(2){animation-delay:2s}.lw i:nth-child(3){animation-delay:4s}
@keyframes rp{0%{opacity:.6;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}
.hero h1{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:800;letter-spacing:.05em;margin-bottom:.2rem}
.tg{font:600 clamp(1.1rem,3vw,1.5rem) 'Bricolage Grotesque',sans-serif;color:var(--oc);margin:0 auto .2rem}
.drop{font-style:italic;color:var(--mut);margin:0 auto 1.2rem}
.hero p.in{margin:0 auto 1.6rem;font-size:1.1rem}
.waves{position:absolute;left:0;right:0;bottom:-1px;height:60px;width:100%}.waves path{animation:dr 10s ease-in-out infinite alternate}@keyframes dr{to{transform:translateX(-60px)}}
.btn{display:inline-block;background:var(--ball);color:#1f0e00;font:600 1rem Figtree,sans-serif;padding:.8rem 1.6rem;border-radius:99px;border:0;cursor:pointer;text-decoration:none;margin:.2rem}
.btn:hover{filter:brightness(1.08)}.btn.o{background:none;border:1.5px solid var(--oc);color:var(--ink)}.btn.s{padding:.4rem .9rem;font-size:.85rem}.btn.d{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.r{background:#C0392B;color:#fff}.btn[disabled]{opacity:.5;cursor:not-allowed}
section{padding:3.5rem 0}.alt{background:#fff}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:560px}
.num{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.2rem;text-align:center}.num b{display:block;font:800 clamp(2.4rem,8vw,3.6rem)/1 'Bricolage Grotesque',sans-serif;color:var(--oc)}.num span{color:var(--mut)}
.note{font-size:.9rem;color:var(--mut);border-left:3px solid var(--lt);padding-left:.8rem;margin-top:1rem}
.banner{background:var(--warn);border:1px solid #E8D28A;border-radius:10px;padding:.8rem 1rem;margin:1rem 0;font-size:.93rem}.ok{background:#DDF7F2;border-color:#8FD9CC}.err{background:#FDE5E2;border-color:#E9A9A1}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.45rem 1.1rem;cursor:pointer;font:500 .95rem Figtree,sans-serif;color:var(--ink)}.tabs button.on{background:var(--oc);border-color:var(--oc);color:#fff}
.flt{display:grid;gap:.6rem;grid-template-columns:1fr 1fr}@media(max-width:560px){.flt{grid-template-columns:1fr}}
input,select,textarea{width:100%;padding:.65rem .85rem;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:90px;resize:vertical}
label{display:block;font-weight:600;font-size:.92rem;margin:.9rem 0 .25rem}.hint{font-size:.82rem;color:var(--mut);font-weight:400}
.list{display:grid;gap:.8rem;margin-top:1rem;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.1rem}.card h3{font-size:1.05rem}.card p{color:var(--mut);font-size:.95rem;margin:.2rem 0 0}
.tag{display:inline-block;font-size:.75rem;font-weight:600;background:var(--sky);color:#0f4a73;padding:.1rem .6rem;border-radius:99px;margin-right:.3rem}.tag.v{background:var(--oc);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}@media(max-width:860px){.two{grid-template-columns:1fr}}
form.f{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.4rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}@media(max-width:520px){.row{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px}.msg{margin-top:1rem}
.plan{list-style:none;padding:0;margin:0 0 1rem;display:grid;gap:.6rem}.plan li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem}.plan li::before{content:"\25CB  ";color:var(--oc)}
.contact{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.page{padding:2.5rem 0 4rem;min-height:70vh}.tabs.a button{font-size:.9rem}.ad{display:grid;gap:.8rem}.ad dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;margin:.6rem 0;font-size:.9rem}.ad dt{color:var(--mut)}.ad dd{margin:0;word-break:break-word}.acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}.priv{background:#EAF4FB;border-radius:10px;padding:.6rem .8rem;margin-top:.5rem;font-size:.88rem}
footer{background:var(--ink);color:#BFD6E8;padding:1.8rem 0;font-size:.9rem;text-align:center}footer a{color:#BFD6E8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
.tick{display:flex;flex-wrap:wrap;gap:6px 16px;margin:.2rem 0 .6rem}.tick label{display:flex;align-items:center;gap:6px;font-weight:400;margin:0}.tick input{width:auto}
</style>
